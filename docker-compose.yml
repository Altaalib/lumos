services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsfilter
      POSTGRES_PASSWORD: newsfilter
      POSTGRES_DB: newsfilter
    ports:
      - "5432:5432"
    volumes:
      - newsfilter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsfilter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  newsfilter-pgdata:
